name: E2E

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        pg_version: [17]

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.${{ matrix.pg_version }}
          platforms: linux/amd64
          tags: postgres-ssl-pitr:${{ matrix.pg_version }}
          load: true
          cache-from: type=gha,scope=pg${{ matrix.pg_version }}
          cache-to: type=gha,scope=pg${{ matrix.pg_version }},mode=max

      - name: Run e2e harness
        shell: bash
        env:
          PG_VERSION: ${{ matrix.pg_version }}
        run: |
          ./test/e2e.sh 2>&1 | tee "e2e-pg${PG_VERSION}.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect failure diagnostics
        if: failure()
        env:
          PG_VERSION: ${{ matrix.pg_version }}
        run: |
          mkdir -p failure-artifacts
          mv "e2e-pg${PG_VERSION}.log" failure-artifacts/ 2>/dev/null || true
          docker ps -a > failure-artifacts/docker-ps.txt 2>&1 || true
          docker volume ls > failure-artifacts/docker-volumes.txt 2>&1 || true
          for c in $(docker ps -aq --filter "label=postgres-ssl-e2e=1"); do
            name=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
            docker logs --tail 200 "$c" > "failure-artifacts/container-${name}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-pg${{ matrix.pg_version }}
          path: failure-artifacts
          retention-days: 14

  # Major-upgrade harness (test/e2e-upgrade.sh): one cell per version pair.
  # 16→17 is the fleet's common pair; 17→18 pins the majors where initdb's
  # data-checksums default flipped (18) — every →18 upgrade would fail
  # --check without the explicit parity flag, which only a real 18 target
  # can regress-test. 15→16 exercises the reg*/aclitem blockers
  # (t_check_blocker_pre16_types self-skips at FROM>=16), which the
  # dashboard preflight also checks for and was otherwise never
  # regression-tested anywhere in CI — pg_upgrade's own behavior here isn't
  # a clean "any pre-16 source" rule (14→15 fires neither check; see the
  # test's own docblock), so this cell is a pair confirmed to trigger both,
  # not a stand-in for every pre-16 pair. 14→17 is the multi-major-jump
  # representative: build-and-push publishes all 10 forward pairs and the
  # product's eligibility gate allows non-adjacent targets, but until this
  # cell no multi-hop pair had ever been executed anywhere. The
  # harness builds its own images (FROM, TO, and the dual-binary job image),
  # so no buildx step is needed here.
  e2e-upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    strategy:
      fail-fast: false
      matrix:
        include:
          - { from: 16, to: 17 }
          - { from: 17, to: 18 }
          - { from: 15, to: 16 }
          - { from: 14, to: 17 }

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Run upgrade e2e harness
        shell: bash
        env:
          FROM_VERSION: ${{ matrix.from }}
          TO_VERSION: ${{ matrix.to }}
          # Keep the harness's containers past its EXIT trap so the failure
          # step below can still `docker logs` them (the trap otherwise
          # removes them first, making that loop dead code). The runner VM
          # is discarded either way.
          E2E_KEEP_CONTAINERS: "1"
        run: |
          ./test/e2e-upgrade.sh 2>&1 | tee "e2e-upgrade-${FROM_VERSION}-${TO_VERSION}.log"
          exit "${PIPESTATUS[0]}"

      - name: Collect failure diagnostics
        if: failure()
        env:
          FROM_VERSION: ${{ matrix.from }}
          TO_VERSION: ${{ matrix.to }}
        run: |
          mkdir -p failure-artifacts
          mv "e2e-upgrade-${FROM_VERSION}-${TO_VERSION}.log" failure-artifacts/ 2>/dev/null || true
          docker ps -a > failure-artifacts/docker-ps.txt 2>&1 || true
          docker volume ls > failure-artifacts/docker-volumes.txt 2>&1 || true
          for c in $(docker ps -aq --filter "label=postgres-upgrade-e2e=1"); do
            name=$(docker inspect -f '{{.Name}}' "$c" | sed 's|^/||')
            docker logs --tail 200 "$c" > "failure-artifacts/container-${name}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-upgrade-logs-${{ matrix.from }}-${{ matrix.to }}
          path: failure-artifacts
          retention-days: 14

  # PostGIS flavor smoke (Q14 gate, MinIO-free): boots each -postgis image,
  # asserts ssl + postgis/topology auto-init + vector installable, then runs
  # a seeded 16->17 upgrade check with the postgis upgrade image. The full
  # MinIO PITR suite (test/e2e.sh) stays lean-only until it is parameterized
  # for flavor tags and the 18 parent mount — tracked as follow-up, not
  # silently claimed here.
  e2e-postgis-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build flavor + upgrade images
        run: |
          set -euo pipefail
          docker build -f Dockerfile.postgis.16 -t postgres-ssl-postgis:16-postgis .
          docker build -f Dockerfile.postgis.17 -t postgres-ssl-postgis:17-postgis .
          docker build -f Dockerfile.postgis.18 -t postgres-ssl-postgis:18-postgis .
          docker build -f Dockerfile.upgrade.postgis \
            --build-arg FROM_VERSION=16 --build-arg TO_VERSION=17 \
            --build-arg POSTGIS_TO_TAG=17-3.5 \
            -t postgres-upgrade-postgis:16-17 .

      - name: Boot assert (ssl + postgis + vector)
        run: |
          set -euo pipefail
          wait_ready() {
            local c="$1"
            for _ in $(seq 1 30); do
              docker exec "$c" pg_isready -U postgres >/dev/null 2>&1 && return 0
              sleep 2
            done
            echo "timed out waiting for $c"; docker logs --tail 50 "$c" || true
            return 1
          }
          # 16/17 mount the data dir; 18 mounts the parent (Q10b).
          docker run -d --name smoke16 -e POSTGRES_PASSWORD=x -e POSTGRES_USER=postgres \
            -v smoke16-vol:/var/lib/postgresql/data postgres-ssl-postgis:16-postgis
          docker run -d --name smoke17 -e POSTGRES_PASSWORD=x -e POSTGRES_USER=postgres \
            -v smoke17-vol:/var/lib/postgresql/data postgres-ssl-postgis:17-postgis
          docker run -d --name smoke18 -e POSTGRES_PASSWORD=x -e POSTGRES_USER=postgres \
            -v smoke18-vol:/var/lib/postgresql postgres-ssl-postgis:18-postgis
          wait_ready smoke16; wait_ready smoke17; wait_ready smoke18
          for c in smoke16 smoke17 smoke18; do
            docker exec "$c" psql -U postgres -tAc "SHOW ssl;" | grep -qx "on"
            docker exec "$c" psql -U postgres -tAc \
              "SELECT count(*) FROM pg_extension WHERE extname IN ('postgis','postgis_topology');" | grep -qx "2"
            docker exec "$c" psql -U postgres -c "CREATE EXTENSION IF NOT EXISTS vector;"
          done
          echo "boot assert passed on 16/17/18-postgis"

      - name: Seeded 16->17 upgrade check
        run: |
          set -euo pipefail
          docker run -d --name upsrc -e POSTGRES_PASSWORD=x -e POSTGRES_USER=postgres \
            -e PGDATA=/var/lib/postgresql/data/pgdata \
            -v up-vol:/var/lib/postgresql/data postgres-ssl-postgis:16-postgis
          for _ in $(seq 1 30); do
            docker exec upsrc pg_isready -U postgres >/dev/null 2>&1 && break
            sleep 2
          done
          docker exec upsrc psql -U postgres -c \
            "CREATE EXTENSION IF NOT EXISTS vector; CREATE TABLE geo(id serial primary key, g geometry(Point,4326), v vector(3)); INSERT INTO geo(g,v) VALUES ('SRID=4326;POINT(1 2)','[1,2,3]');"
          docker stop upsrc
          docker run --rm -e PGDATA=/var/lib/postgresql/data/pgdata -e POSTGRES_USER=postgres \
            -v up-vol:/var/lib/postgresql/data postgres-upgrade-postgis:16-17 check

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p failure-artifacts
          docker ps -a > failure-artifacts/docker-ps.txt 2>&1 || true
          for c in smoke16 smoke17 smoke18 upsrc; do
            docker logs --tail 200 "$c" > "failure-artifacts/container-${c}.log" 2>&1 || true
          done

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-postgis-smoke-logs
          path: failure-artifacts
          retention-days: 14
